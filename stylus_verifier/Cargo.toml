[package]
name = "mandate-vault-stylus-verifier"
version = "1.0.0"
edition = "2021"
description = "Arbitrum Stylus Pluggable Ed25519 + AP2 Mandate Coprocessor Verifier implementing IMandateVerifier"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
stylus-wasm = []

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
